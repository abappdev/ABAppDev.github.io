<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>गोलावाला</title>
    <meta name="description" content="गोलावाला — a minimalist YouTube playlist radio.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1a1838">
    <style>
        /* Reset */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --text-primary: #faf7f4;
            --text-secondary: rgba(250, 247, 244, 0.78);
            --text-muted: rgba(250, 247, 244, 0.55);
            --focus-ring: rgba(255, 255, 255, 0.72);
            --background-position: center center;
            --player-bg: rgba(72, 34, 30, 0.46);
            --player-border: rgba(255, 255, 255, 0.2);
            --player-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
            --accent-line: rgba(255, 220, 190, 0.92);
            --accent-line-dim: rgba(255, 255, 255, 0.18);
            --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
            --font-devanagari: "Noto Serif Devanagari", "Kohinoor Devanagari", "Devanagari MT", "Mangal", "Nirmala UI", "Segoe UI", sans-serif;
            --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --player-max: 600px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-ui);
            color: var(--text-primary);
            background: #120c10;
        }

        body[data-accent="cool"] {
            --player-bg: rgba(24, 36, 58, 0.46);
            --accent-line: rgba(190, 220, 255, 0.92);
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: none;
            cursor: pointer;
        }

        button:focus-visible {
            outline: 2px solid var(--focus-ring);
            outline-offset: 2px;
        }

        button:disabled {
            opacity: 0.38;
            cursor: not-allowed;
        }

        img {
            display: block;
            max-width: 100%;
        }

        /* Scene */
        .background {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-color: #141428;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: var(--background-position-mobile, center 40%);
        }

        @media (min-width: 768px) {
            .background {
                background-position: var(--background-position-desktop, center 48%);
            }
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                linear-gradient(
                    180deg,
                    rgba(10, 12, 28, 0.28) 0%,
                    rgba(10, 12, 28, 0.04) 24%,
                    rgba(10, 12, 28, 0.06) 48%,
                    rgba(8, 8, 18, 0.38) 78%,
                    rgba(6, 6, 14, 0.62) 100%
                );
        }

        .scene {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            padding:
                max(14px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(18px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));
        }

        /* Top Bar */
        .topbar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 0.75rem;
            min-height: 2rem;
            animation: fadeDown 0.45s var(--ease) both;
        }

        .topbar__clock {
            font-size: 0.82rem;
            font-variant-numeric: tabular-nums;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
        }

        .topbar__status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-primary);
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #6fe08a;
            box-shadow: 0 0 10px rgba(111, 224, 138, 0.75);
            flex-shrink: 0;
        }

        .topbar__volume {
            justify-self: end;
            position: relative;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 999px;
            transition: transform 0.18s var(--ease), background 0.18s ease;
        }

        .icon-btn:not(:disabled):active {
            transform: scale(0.94);
        }

        .icon-btn svg {
            width: 1.15rem;
            height: 1.15rem;
            fill: currentColor;
        }

        .volume-pop {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.55rem 0.7rem;
            border-radius: 999px;
            background: rgba(20, 14, 18, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-4px);
            transition: opacity 0.22s var(--ease), transform 0.22s var(--ease), visibility 0.22s;
        }

        .volume-pop.is-open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .volume-pop__slider {
            -webkit-appearance: none;
            appearance: none;
            width: 7.5rem;
            height: 3px;
            border-radius: 999px;
            background: linear-gradient(
                to right,
                var(--accent-line) 0%,
                var(--accent-line) var(--fill, 70%),
                var(--accent-line-dim) var(--fill, 70%),
                var(--accent-line-dim) 100%
            );
            outline: none;
            cursor: pointer;
        }

        .volume-pop__slider:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .volume-pop__slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            border: none;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25);
        }

        .volume-pop__slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            border: none;
        }

        /* Radio Branding */
        .scene__center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: clamp(1rem, 6vh, 3rem);
            text-align: center;
            pointer-events: none;
        }

        .radio-title {
            font-family: var(--font-devanagari);
            font-size: clamp(2.2rem, 10vw, 4rem);
            font-weight: 600;
            line-height: 1.08;
            letter-spacing: 0.02em;
            color: var(--text-primary);
            text-shadow:
                0 2px 18px rgba(0, 0, 0, 0.55),
                0 0 40px rgba(0, 0, 0, 0.25);
            max-width: 92vw;
            animation: fadeUp 0.55s var(--ease) 0.08s both;
        }

        /* Vinyl */
        .player-dock {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            width: min(94vw, var(--player-max));
            animation: fadeUp 0.55s var(--ease) 0.14s both;
        }

        .player-dock .vinyl {
            pointer-events: auto;
        }

        .vinyl {
            --vinyl-size: clamp(9.5rem, 34vw, 13.5rem);
            position: relative;
            width: var(--vinyl-size);
            height: var(--vinyl-size);
            border-radius: 50%;
            background:
                radial-gradient(circle at center, rgba(18, 12, 16, 0.2) 0 18%, transparent 19%),
                repeating-radial-gradient(circle at center, #141014 0 2px, #0a080a 2px 4px);
            box-shadow:
                0 18px 42px rgba(0, 0, 0, 0.42),
                inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            transition: transform 0.35s var(--ease);
        }

        .vinyl.is-playing {
            animation: vinylSpin 5.5s linear infinite;
        }

        .vinyl__grooves {
            position: absolute;
            inset: 7%;
            border-radius: 50%;
            background:
                radial-gradient(circle, transparent 58%, rgba(255, 255, 255, 0.03) 59%, transparent 60%),
                radial-gradient(circle, transparent 72%, rgba(255, 255, 255, 0.04) 73%, transparent 74%);
            pointer-events: none;
        }

        .vinyl__label {
            position: absolute;
            inset: 24%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.18),
                0 8px 20px rgba(0, 0, 0, 0.28);
            background: rgba(255, 255, 255, 0.08);
            transition: opacity 0.28s var(--ease);
        }

        .vinyl__label[hidden] {
            display: block;
            opacity: 0;
        }

        .vinyl__play {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            width: 3.35rem;
            height: 3.35rem;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #1a1210;
            background: rgba(255, 252, 248, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            transition: transform 0.2s var(--ease), background 0.2s ease;
        }

        .vinyl.is-playing .vinyl__play {
            background: rgba(255, 252, 248, 0.88);
            animation: vinylSpinReverse 5.5s linear infinite;
        }

        .vinyl__play:not(:disabled):active {
            transform: translate(-50%, -50%) scale(0.94);
        }

        .vinyl__play svg {
            width: 1.25rem;
            height: 1.25rem;
            fill: currentColor;
        }

        .vinyl__play .icon-pause {
            display: none;
        }

        .vinyl__play.is-playing .icon-play {
            display: none;
        }

        .vinyl__play.is-playing .icon-pause {
            display: block;
        }

        .player-dock .track-text {
            width: 100%;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.28s var(--ease);
            padding: 0 0.25rem 0.15rem;
        }

        /* Ambient Caption */
        .caption {
            margin-top: clamp(0.75rem, 3vh, 1.25rem);
            width: min(88vw, var(--player-max));
            text-align: center;
            font-family: var(--font-display);
            font-size: clamp(0.92rem, 3.4vw, 1.08rem);
            line-height: 1.45;
            color: rgba(255, 250, 245, 0.82);
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
            pointer-events: none;
            animation: fadeUp 0.5s var(--ease) 0.16s both;
        }

        .caption[hidden] {
            display: none;
        }

        /* Player */
        .scene__bottom {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: max(18px, env(safe-area-inset-bottom));
        }

        .player-pill {
            position: relative;
            width: 100%;
            min-height: 3.35rem;
            padding: 0.45rem 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.24);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            box-shadow:
                0 14px 38px rgba(0, 0, 0, 0.24),
                inset 0 1px 0 rgba(255, 255, 255, 0.14);
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: opacity 0.32s var(--ease), transform 0.32s var(--ease), visibility 0.32s;
        }

        .player-pill.is-visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .player-pill:not(.is-started) {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .pill-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.35rem;
            height: 2.35rem;
            flex-shrink: 0;
            border-radius: 50%;
            color: var(--text-primary);
            transition: transform 0.18s var(--ease), background 0.18s ease;
        }

        .pill-btn:not(:disabled):hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .pill-btn:not(:disabled):active {
            transform: scale(0.92);
        }

        .pill-btn svg {
            width: 1.1rem;
            height: 1.1rem;
            fill: currentColor;
        }

        /* Progress */
        .player-pill__seek {
            flex: 1;
            min-width: 0;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 0.45rem;
        }

        .player-pill__time {
            font-size: 0.68rem;
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
            min-width: 2rem;
        }

        .player-pill__time--end {
            text-align: right;
        }

        .progress__bar {
            display: flex;
            align-items: center;
            height: 1.1rem;
        }

        .progress__slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            border-radius: 999px;
            background: linear-gradient(
                to right,
                var(--accent-line) 0%,
                var(--accent-line) var(--fill, 0%),
                var(--accent-line-dim) var(--fill, 0%),
                var(--accent-line-dim) 100%
            );
            outline: none;
            cursor: pointer;
            transition: background 0.2s linear;
        }

        .progress__slider:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .progress__slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            border: none;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.22);
        }

        .progress__slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            border: none;
        }

        /* Track Metadata */

        .track-text.is-fading {
            opacity: 0.35;
        }

        .track-title {
            font-size: clamp(1rem, 4.2vw, 1.12rem);
            font-weight: 700;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            margin-top: 0.18rem;
            font-size: 0.82rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist:empty {
            display: none;
        }

        .track-index {
            margin-top: 0.2rem;
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }

        .track-index:empty {
            display: none;
        }

        .track-status {
            margin-top: 0.18rem;
            font-size: 0.74rem;
            color: var(--text-muted);
            min-height: 1rem;
        }

        .track-status:empty {
            display: none;
        }

        .track-status[data-tone="error"] {
            color: #f0b0a8;
        }

        /* Volume */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .yt-player {
            position: fixed;
            width: 1px;
            height: 1px;
            left: -9999px;
            top: auto;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes vinylSpinReverse {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(-360deg); }
        }

        @keyframes vinylSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .player-dock {
                width: min(94vw, 100%);
                gap: 0.65rem;
            }

            .player-pill {
                padding: 0.4rem 0.55rem;
                gap: 0.3rem;
            }

            .pill-btn {
                width: 2.15rem;
                height: 2.15rem;
            }

            .player-pill__seek {
                gap: 0.35rem;
            }

            .player-pill__time {
                font-size: 0.64rem;
                min-width: 1.8rem;
            }
        }
    </style>
</head>
<body data-accent="warm">
    <div class="background" id="background" aria-hidden="true"></div>
    <div class="overlay" id="overlay" aria-hidden="true"></div>

    <div class="scene">
        <header class="topbar">
            <time class="topbar__clock" id="clockTime" datetime="">—</time>
            <div class="topbar__status">
                <span class="live-dot" aria-hidden="true"></span>
                <span id="topSiteName">गोलावाला</span>
            </div>
            <div class="topbar__volume">
                <button type="button" class="icon-btn" id="volumeToggle" aria-label="Volume" aria-expanded="false" aria-controls="volumePop" disabled>
                    <svg class="icon-volume-high" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.06c1.48-.74 2.5-2.26 2.5-4.03zM14 3.23v2.06c2.89 1 5 3.77 5 6.71s-2.11 5.71-5 6.71v2.06c4.01-1.18 7-5.06 7-9.77S18.01 4.41 14 3.23z"/></svg>
                    <svg class="icon-volume-low" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 10v4h4l5 5V5L9 10H5z"/></svg>
                    <svg class="icon-volume-mute" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-8.03-7-9.11v2.18c2.89 1 5 3.77 5 6.93zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
                </button>
                <div class="volume-pop" id="volumePop" role="group" aria-label="Volume control">
                    <label class="sr-only" for="volumeSlider">Volume</label>
                    <input
                        type="range"
                        class="volume-pop__slider"
                        id="volumeSlider"
                        min="0"
                        max="100"
                        value="70"
                        step="1"
                        disabled
                    >
                </div>
            </div>
        </header>

        <div class="scene__center">
            <h1 class="radio-title" id="siteName">गोलावाला</h1>
            <p class="caption" id="caption" hidden></p>
        </div>

        <div class="scene__bottom">
            <div class="player-dock">
                <div class="vinyl" id="vinylDisc">
                    <div class="vinyl__grooves" aria-hidden="true"></div>
                    <img class="vinyl__label" id="trackArt" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" width="120" height="120" hidden>
                    <button type="button" class="vinyl__play" id="playPauseBtn" aria-label="Play" disabled>
                        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/></svg>
                        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                </div>

                <section class="player-pill" id="playerPanel" aria-label="Radio controls">
                    <button type="button" class="pill-btn" id="prevBtn" aria-label="Previous track" disabled>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>
                    </button>

                    <div class="player-pill__seek">
                        <span class="player-pill__time" id="currentTime">0:00</span>
                        <div class="progress__bar">
                            <input
                                type="range"
                                class="progress__slider"
                                id="progressSlider"
                                min="0"
                                max="1000"
                                value="0"
                                step="1"
                                aria-label="Playback position"
                                disabled
                            >
                        </div>
                        <span class="player-pill__time player-pill__time--end" id="totalTime">0:00</span>
                    </div>

                    <button type="button" class="pill-btn" id="nextBtn" aria-label="Next track" disabled>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18l8.5-6L6 6v12zm10-12v12h2V6h-2z"/></svg>
                    </button>
                </section>

                <div class="track-text" id="trackText">
                    <h2 class="track-title" id="trackTitle">—</h2>
                    <p class="track-artist" id="trackArtist"></p>
                    <p class="track-index" id="trackIndicator" aria-live="polite"></p>
                    <p class="track-status" id="statusMessage" aria-live="polite">Loading radio…</p>
                </div>
            </div>
        </div>
    </div>

    <div class="yt-player" id="ytPlayer" aria-hidden="true"></div>

    <script>
        /*
        |--------------------------------------------------------------------------
        | RADIO CONFIGURATION
        |--------------------------------------------------------------------------
        | Forking this project?
        | Usually you only need to change the values below.
        */

        const CONFIG = Object.freeze({
            siteName: "गोलावाला",
            backgroundImage: "./background.jpg",
            backgroundPosition: "center 40%",
            backgroundPositionDesktop: "center 48%",
            overlayOpacity: 0.22,
            youtubePlaylistUrl: "https://music.youtube.com/playlist?list=PLUGKQJQR9WdU&si=vI7nU-wlCLGC8lAn",
            defaultVolume: 70,
            caption: "",
            accentStyle: "warm"
        });

        const app = {
            player: null,
            playlistId: null,
            ready: false,
            userStarted: false,
            isBuffering: false,
            isSeeking: false,
            isMuted: false,
            volume: CONFIG.defaultVolume,
            duration: 0,
            progressTimer: null,
            clockTimer: null,
            errorSkipInFlight: false,
            volumeOpen: false,
            elements: {}
        };

        const YT_STATES = {
            UNSTARTED: -1,
            ENDED: 0,
            PLAYING: 1,
            PAUSED: 2,
            BUFFERING: 3,
            CUED: 5
        };

        function cacheElements() {
            app.elements = {
                background: document.getElementById("background"),
                overlay: document.getElementById("overlay"),
                siteName: document.getElementById("siteName"),
                topSiteName: document.getElementById("topSiteName"),
                caption: document.getElementById("caption"),
                clockTime: document.getElementById("clockTime"),
                playerPanel: document.getElementById("playerPanel"),
                vinylDisc: document.getElementById("vinylDisc"),
                trackArt: document.getElementById("trackArt"),
                trackText: document.getElementById("trackText"),
                trackTitle: document.getElementById("trackTitle"),
                trackArtist: document.getElementById("trackArtist"),
                trackIndicator: document.getElementById("trackIndicator"),
                statusMessage: document.getElementById("statusMessage"),
                currentTime: document.getElementById("currentTime"),
                totalTime: document.getElementById("totalTime"),
                progressSlider: document.getElementById("progressSlider"),
                playPauseBtn: document.getElementById("playPauseBtn"),
                prevBtn: document.getElementById("prevBtn"),
                nextBtn: document.getElementById("nextBtn"),
                volumeToggle: document.getElementById("volumeToggle"),
                volumePop: document.getElementById("volumePop"),
                volumeSlider: document.getElementById("volumeSlider"),
                ytPlayer: document.getElementById("ytPlayer")
            };
        }

        function applyConfiguration() {
            const {
                background,
                overlay,
                siteName,
                topSiteName,
                caption,
                volumeSlider,
                playerPanel
            } = app.elements;

            siteName.textContent = CONFIG.siteName;
            topSiteName.textContent = CONFIG.siteName;
            document.title = CONFIG.siteName;

            background.style.backgroundImage = "url(" + CONFIG.backgroundImage + ")";
            document.documentElement.style.setProperty("--background-position-mobile", CONFIG.backgroundPosition);
            document.documentElement.style.setProperty(
                "--background-position-desktop",
                CONFIG.backgroundPositionDesktop || CONFIG.backgroundPosition
            );

            const opacity = Math.min(1, Math.max(0, Number(CONFIG.overlayOpacity) || 0));
            overlay.style.opacity = String(opacity);

            const accent = CONFIG.accentStyle === "cool" ? "cool" : "warm";
            document.body.setAttribute("data-accent", accent);

            if (CONFIG.caption && String(CONFIG.caption).trim()) {
                caption.textContent = String(CONFIG.caption).trim();
                caption.hidden = false;
            } else {
                caption.textContent = "";
                caption.hidden = true;
            }

            const volume = clampVolume(CONFIG.defaultVolume);
            app.volume = volume;
            volumeSlider.value = String(volume);
            updateVolumeSliderFill(volume);
        }

        function clampVolume(value) {
            const numeric = Number(value);
            if (!Number.isFinite(numeric)) {
                return 70;
            }
            return Math.min(100, Math.max(0, Math.round(numeric)));
        }

        function extractPlaylistId(url) {
            if (typeof url !== "string" || !url.trim()) {
                return null;
            }

            try {
                const parsed = new URL(url.trim());
                const listParam = parsed.searchParams.get("list");
                if (listParam && /^[A-Za-z0-9_-]+$/.test(listParam)) {
                    return listParam;
                }
            } catch (error) {
                return null;
            }

            const match = url.match(/[?&]list=([A-Za-z0-9_-]+)/);
            return match ? match[1] : null;
        }

        function formatTime(seconds) {
            const total = Math.max(0, Math.floor(Number(seconds) || 0));
            const minutes = Math.floor(total / 60);
            const remainder = total % 60;
            return minutes + ":" + String(remainder).padStart(2, "0");
        }

        function formatClock(date) {
            const hours = date.getHours();
            const minutes = date.getMinutes();
            const h12 = hours % 12 || 12;
            const ampm = hours >= 12 ? "pm" : "am";
            return h12 + ":" + String(minutes).padStart(2, "0") + " " + ampm;
        }

        function updateClock() {
            const now = new Date();
            app.elements.clockTime.textContent = formatClock(now);
            app.elements.clockTime.setAttribute("datetime", now.toISOString());
        }

        function startClock() {
            updateClock();
            app.clockTimer = window.setInterval(updateClock, 30000);
        }

        function setStatus(message, tone) {
            const { statusMessage } = app.elements;
            statusMessage.textContent = message || "";
            if (tone === "error") {
                statusMessage.setAttribute("data-tone", "error");
            } else {
                statusMessage.removeAttribute("data-tone");
            }
        }

        function setControlsEnabled(enabled) {
            const {
                progressSlider,
                playPauseBtn,
                prevBtn,
                nextBtn,
                volumeToggle,
                volumeSlider
            } = app.elements;

            playPauseBtn.disabled = !enabled;

            if (!app.userStarted) {
                progressSlider.disabled = true;
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                volumeToggle.disabled = !enabled;
                volumeSlider.disabled = !enabled;
                return;
            }

            progressSlider.disabled = !enabled;
            prevBtn.disabled = !enabled;
            nextBtn.disabled = !enabled;
            volumeToggle.disabled = !enabled;
            volumeSlider.disabled = !enabled;
        }

        function revealPlayerControls() {
            app.elements.playerPanel.classList.add("is-started", "is-visible");
            setControlsEnabled(app.ready);
        }

        function updateProgressFill(percent) {
            const fill = Math.min(100, Math.max(0, percent));
            app.elements.progressSlider.style.setProperty("--fill", fill + "%");
        }

        function updateVolumeSliderFill(volume) {
            app.elements.volumeSlider.style.setProperty("--fill", volume + "%");
        }

        function updatePlayPauseButton(isPlaying) {
            const { playPauseBtn, vinylDisc } = app.elements;
            if (isPlaying) {
                playPauseBtn.classList.add("is-playing");
                vinylDisc.classList.add("is-playing");
                playPauseBtn.setAttribute("aria-label", "Pause");
            } else {
                playPauseBtn.classList.remove("is-playing");
                vinylDisc.classList.remove("is-playing");
                playPauseBtn.setAttribute("aria-label", "Play");
            }
        }

        function updateMuteButton() {
            const { volumeToggle, volumeSlider } = app.elements;
            const icons = {
                high: volumeToggle.querySelector(".icon-volume-high"),
                low: volumeToggle.querySelector(".icon-volume-low"),
                mute: volumeToggle.querySelector(".icon-volume-mute")
            };

            icons.high.hidden = true;
            icons.low.hidden = true;
            icons.mute.hidden = true;

            if (app.isMuted || Number(volumeSlider.value) === 0) {
                icons.mute.hidden = false;
                volumeToggle.setAttribute("aria-label", "Unmute");
            } else if (Number(volumeSlider.value) < 35) {
                icons.low.hidden = false;
                volumeToggle.setAttribute("aria-label", "Volume");
            } else {
                icons.high.hidden = false;
                volumeToggle.setAttribute("aria-label", "Volume");
            }
        }

        function fadeTrackMetadata(callback) {
            const { trackText, trackArt } = app.elements;
            trackText.classList.add("is-fading");
            trackArt.style.opacity = "0.45";

            window.setTimeout(function () {
                callback();
                trackText.classList.remove("is-fading");
                trackArt.style.opacity = "1";
            }, 160);
        }

        function updateTrackMetadata() {
            if (!app.player || typeof app.player.getVideoData !== "function") {
                return;
            }

            const data = app.player.getVideoData();
            const title = data && data.title ? data.title : "—";
            const author = data && data.author ? data.author : "";
            const videoId = data && data.video_id ? data.video_id : "";

            fadeTrackMetadata(function () {
                app.elements.trackTitle.textContent = title;

                if (author) {
                    app.elements.trackArtist.textContent = author;
                    app.elements.trackArtist.hidden = false;
                } else {
                    app.elements.trackArtist.textContent = "";
                    app.elements.trackArtist.hidden = true;
                }

                if (videoId) {
                    app.elements.trackArt.src = "https://i.ytimg.com/vi/" + videoId + "/hqdefault.jpg";
                    app.elements.trackArt.alt = title + " artwork";
                    app.elements.trackArt.hidden = false;
                }
            });
        }

        function updateTrackIndicator() {
            if (!app.player || typeof app.player.getPlaylistIndex !== "function") {
                app.elements.trackIndicator.textContent = "";
                return;
            }

            const index = app.player.getPlaylistIndex();
            if (typeof index !== "number" || index < 0) {
                app.elements.trackIndicator.textContent = "";
                return;
            }

            app.elements.trackIndicator.textContent = (index + 1) + " / Playlist";
        }

        function updateDurationDisplay() {
            if (!app.player || typeof app.player.getDuration !== "function") {
                app.duration = 0;
                app.elements.totalTime.textContent = "0:00";
                return;
            }

            const duration = app.player.getDuration();
            app.duration = Number.isFinite(duration) && duration > 0 ? duration : 0;
            app.elements.totalTime.textContent = formatTime(app.duration);
        }

        function updateProgressDisplay() {
            if (!app.player || typeof app.player.getCurrentTime !== "function") {
                return;
            }

            const current = app.player.getCurrentTime();
            app.elements.currentTime.textContent = formatTime(current);

            if (!app.isSeeking && app.duration > 0) {
                const percent = (current / app.duration) * 100;
                updateProgressFill(percent);
                app.elements.progressSlider.value = String(Math.round((current / app.duration) * 1000));
            }
        }

        function startProgressTimer() {
            stopProgressTimer();
            app.progressTimer = window.setInterval(updateProgressDisplay, 500);
        }

        function stopProgressTimer() {
            if (app.progressTimer !== null) {
                window.clearInterval(app.progressTimer);
                app.progressTimer = null;
            }
        }

        function handlePlayerStateChange(state) {
            app.isBuffering = state === YT_STATES.BUFFERING;

            if (state === YT_STATES.PLAYING) {
                updatePlayPauseButton(true);
                updateTrackMetadata();
                updateTrackIndicator();
                updateDurationDisplay();
                updateProgressDisplay();
                startProgressTimer();
                setStatus("");
                return;
            }

            stopProgressTimer();

            if (state === YT_STATES.PAUSED) {
                updatePlayPauseButton(false);
                updateProgressDisplay();
                if (app.userStarted) {
                    setStatus("");
                }
                return;
            }

            if (state === YT_STATES.BUFFERING) {
                setStatus("Buffering…");
                return;
            }

            if (state === YT_STATES.ENDED) {
                updatePlayPauseButton(false);
                setStatus("");
                return;
            }

            if (state === YT_STATES.CUED || state === YT_STATES.UNSTARTED) {
                updatePlayPauseButton(false);
                updateTrackMetadata();
                updateTrackIndicator();
                updateDurationDisplay();
                if (!app.userStarted) {
                    setStatus("");
                }
            }
        }

        function skipUnavailableTrack() {
            if (!app.player || app.errorSkipInFlight) {
                return;
            }

            app.errorSkipInFlight = true;
            setStatus("Unable to play this track", "error");

            window.setTimeout(function () {
                app.errorSkipInFlight = false;
                if (!app.player) {
                    return;
                }

                try {
                    app.player.nextVideo();
                } catch (error) {
                    setStatus("Playlist unavailable", "error");
                }
            }, 900);
        }

        function onPlayerError(event) {
            const code = event && typeof event.data === "number" ? event.data : 0;

            if (code === 100 || code === 101 || code === 150 || code === 103) {
                skipUnavailableTrack();
                return;
            }

            setStatus("Unable to play this track", "error");
        }

        function onPlayerReady() {
            app.ready = true;
            setControlsEnabled(true);

            try {
                app.player.setVolume(app.volume);
                if (app.isMuted) {
                    app.player.mute();
                }
            } catch (error) {
                /* volume may fail before user gesture; retried on play */
            }

            updateTrackMetadata();
            updateTrackIndicator();
            updateDurationDisplay();
            updateProgressDisplay();
            updateMuteButton();

            if (!app.userStarted) {
                setStatus("");
            }
        }

        function initPlayer() {
            app.playlistId = extractPlaylistId(CONFIG.youtubePlaylistUrl);

            if (!app.playlistId) {
                setStatus("Playlist unavailable", "error");
                setControlsEnabled(false);
                return;
            }

            app.player = new YT.Player(app.elements.ytPlayer, {
                height: "1",
                width: "1",
                playerVars: {
                    autoplay: 0,
                    controls: 0,
                    disablekb: 1,
                    fs: 0,
                    modestbranding: 1,
                    playsinline: 1,
                    rel: 0,
                    iv_load_policy: 3,
                    listType: "playlist",
                    list: app.playlistId
                },
                events: {
                    onReady: onPlayerReady,
                    onStateChange: function (event) {
                        handlePlayerStateChange(event.data);
                    },
                    onError: onPlayerError
                }
            });
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) {
                initPlayer();
                return;
            }

            const previousReady = window.onYouTubeIframeAPIReady;
            window.onYouTubeIframeAPIReady = function () {
                if (typeof previousReady === "function") {
                    previousReady();
                }
                initPlayer();
            };

            const tag = document.createElement("script");
            tag.src = "https://www.youtube.com/iframe_api";
            tag.async = true;
            const firstScript = document.getElementsByTagName("script")[0];
            firstScript.parentNode.insertBefore(tag, firstScript);
        }

        function beginPlayback() {
            if (!app.player || !app.ready) {
                return;
            }

            app.userStarted = true;
            revealPlayerControls();

            try {
                if (app.isMuted) {
                    app.player.mute();
                } else {
                    app.player.unMute();
                    app.player.setVolume(app.volume);
                }
                app.player.playVideo();
            } catch (error) {
                setStatus("Unable to start radio", "error");
                app.userStarted = false;
                app.elements.playerPanel.classList.remove("is-started");
                setControlsEnabled(app.ready);
            }
        }

        function togglePlayPause() {
            if (!app.player || !app.ready) {
                return;
            }

            const state = app.player.getPlayerState();

            if (state === YT_STATES.PLAYING || state === YT_STATES.BUFFERING) {
                app.player.pauseVideo();
                return;
            }

            if (!app.userStarted) {
                beginPlayback();
                return;
            }

            app.player.playVideo();
        }

        function setVolumeOpen(open) {
            app.volumeOpen = open;
            app.elements.volumePop.classList.toggle("is-open", open);
            app.elements.volumeToggle.setAttribute("aria-expanded", open ? "true" : "false");
        }

        function toggleMute() {
            const { volumeSlider } = app.elements;

            if (!app.player || !app.ready) {
                return;
            }

            if (app.isMuted) {
                app.isMuted = false;
                app.player.unMute();
                app.player.setVolume(clampVolume(volumeSlider.value));
            } else {
                app.isMuted = true;
                app.player.mute();
            }

            updateMuteButton();
        }

        function bindUiEvents() {
            const {
                playPauseBtn,
                prevBtn,
                nextBtn,
                volumeToggle,
                volumePop,
                volumeSlider,
                progressSlider
            } = app.elements;

            playPauseBtn.addEventListener("click", togglePlayPause);

            prevBtn.addEventListener("click", function () {
                if (app.player && app.ready) {
                    app.player.previousVideo();
                }
            });

            nextBtn.addEventListener("click", function () {
                if (app.player && app.ready) {
                    app.player.nextVideo();
                }
            });

            volumeToggle.addEventListener("click", function (event) {
                event.stopPropagation();
                if (!app.ready) {
                    return;
                }
                setVolumeOpen(!app.volumeOpen);
            });

            volumeToggle.addEventListener("dblclick", function (event) {
                event.preventDefault();
                toggleMute();
            });

            document.addEventListener("click", function (event) {
                if (!app.volumeOpen) {
                    return;
                }
                if (!volumePop.contains(event.target) && event.target !== volumeToggle && !volumeToggle.contains(event.target)) {
                    setVolumeOpen(false);
                }
            });

            volumeSlider.addEventListener("input", function () {
                const volume = clampVolume(volumeSlider.value);
                app.volume = volume;
                updateVolumeSliderFill(volume);

                if (!app.player || !app.ready) {
                    return;
                }

                if (volume === 0) {
                    app.isMuted = true;
                    app.player.mute();
                } else {
                    app.isMuted = false;
                    app.player.unMute();
                    app.player.setVolume(volume);
                }

                updateMuteButton();
            });

            progressSlider.addEventListener("pointerdown", function () {
                app.isSeeking = true;
            });

            progressSlider.addEventListener("pointerup", function () {
                app.isSeeking = false;
                updateProgressDisplay();
            });

            progressSlider.addEventListener("input", function () {
                if (!app.duration) {
                    return;
                }

                const ratio = Number(progressSlider.value) / 1000;
                const seekTime = ratio * app.duration;
                updateProgressFill(ratio * 100);
                app.elements.currentTime.textContent = formatTime(seekTime);
            });

            progressSlider.addEventListener("change", function () {
                if (!app.player || !app.ready || !app.duration) {
                    return;
                }

                const ratio = Number(progressSlider.value) / 1000;
                app.player.seekTo(ratio * app.duration, true);
                app.isSeeking = false;
                updateProgressDisplay();
            });

            document.addEventListener("keydown", function (event) {
                if (!app.ready) {
                    return;
                }

                const target = event.target;
                const tag = target && target.tagName ? target.tagName.toLowerCase() : "";
                const inputType = target && target.type ? target.type.toLowerCase() : "";

                if (tag === "textarea" || tag === "select" || (tag === "input" && inputType !== "range")) {
                    return;
                }

                if (event.code === "Space") {
                    event.preventDefault();
                    togglePlayPause();
                    return;
                }

                if (event.code === "ArrowRight" && app.player) {
                    event.preventDefault();
                    app.player.nextVideo();
                    return;
                }

                if (event.code === "ArrowLeft" && app.player) {
                    event.preventDefault();
                    app.player.previousVideo();
                }
            });
        }

        function init() {
            cacheElements();
            applyConfiguration();
            setControlsEnabled(false);
            setStatus("Loading radio…");
            startClock();
            bindUiEvents();
            loadYouTubeApi();
        }

        init();
    </script>
</body>
</html>
